id: C3
name: Structured error reporting
tier: Critical
weight: 3
effort: S
summary: |-
  Declared, retrievable typed errors with a message, structured context and a qualifying timestamp or event-sequence record
applicability:
requirement: |-
  Failures MUST surface as typed errors carrying: (a) a stable machine-readable error identifier or class (beyond a free-text message); (b) a human-readable message; (c) at least one structured context field relevant to the failure, such as affected parameter name and value, affected resource or functional unit, device state at fault, violated constraint, command identifier, or sensor or channel identifier; and (d) a timing record satisfying one of: (d1) a device-local timestamp, taken at the moment the error is detected, with time zone and documented clock-source metadata (for example, NTP-synchronized, GPS-disciplined, or hardware RTC with documented drift bound); or (d2) a monotonic event-sequence identifier with a documented epoch and monotonicity guarantee, combined with a timestamp appended by the trusted control gateway or server, which must document its own clock source and synchronization method. Where neither device-local timestamps nor gateway timestamp appending are available (for example, microcontroller-class hardware without NTP synchronization and without a connected gateway that can append timestamps), the vendor MUST document why and MUST provide a bare event-sequence identifier as a substitute; a general assertion that timestamps are unavailable without documented rationale does not satisfy this sub-requirement. Undocumented or unsynchronized device-local clocks without clock-source metadata do not satisfy (d1). On the (d1) path the device SHOULD additionally report the current synchronization status of that clock and a documented timestamp uncertainty (for example ±X ms), so a consumer can judge how far the timestamp can be trusted. GUI-only dialogs, log-file-only diagnostics, and silent failures disqualify. The set of errors a command or endpoint can raise MUST be declared as part of the machine-readable interface contract (its error catalog; for example, SiLA 2's defined errors in the FDL, or a documented error list for an OPC UA or REST endpoint), so a client can know in advance which errors a call may return rather than discovering them at runtime. Errors MUST also be logged or persisted (by the instrument, or by the trusted gateway or server that fronts it) so that they remain retrievable after delivery, not only surfaced transiently in the response. They SHOULD additionally be documented in the integration manual, ideally with a description of the internal state machines that govern when each error can arise.
grade_options:
- Pass
- Partial
- Fail
grading: |-
  Pass requires all four sub-requirements present in the error payload: a typed error identifier (a), a human-readable message (b), at least one structured context field (c), and a timing record meeting sub-requirement (d). Sub-requirement (d) is satisfied at Pass grade by either path: (d1) a device-local timestamp with time zone and documented clock-source metadata, or (d2) a monotonic event-sequence identifier with documented epoch and monotonicity guarantee combined with a gateway-appended timestamp with documented clock source and synchronization method. An undocumented or unsynchronized device clock without clock-source metadata does not satisfy (d1) and does not qualify for Pass. The timing requirement is evaluated independently of the context field: an error payload with no timing record of any kind (no timestamp and no event-sequence identifier), where the vendor has not documented why neither (d1) nor (d2) is available, is Fail regardless of whether (a), (b), or (c) are present, because the vendor MUST supply at least a bare event-sequence identifier when timestamps are unavailable. Given a qualifying timing record, or a documented bare event-sequence substitute, Partial covers either: (i) typed error identifier and human-readable message (a and b) present, but no structured context field (c); or (ii) all of (a), (b), and (c) present, and only a bare event-sequence identifier (without a gateway-appended timestamp and without documented clock-source metadata on the device) is provided, with vendor documentation explaining why neither (d1) nor (d2) is available, which caps at Partial for lacking an absolute time reference. Fail covers errors surfaced only as free-text messages or human-readable strings without a stable machine-readable identifier, GUI-only error dialogs, log-file-only diagnostics, or silent failure with no error payload at all. Independently of the payload sub-requirements, an endpoint that reports typed errors at runtime but does not declare its error catalog in the machine-readable contract, or whose errors are not logged or persisted anywhere retrievable after delivery, caps at Partial; integration-manual documentation of the errors and their state machines is a SHOULD and does not affect the grade.
test: |-
  Induce failures from at least two different categories: one operational or environmental fault (such as missing sample, sensor out of range, or door open) and one command, parameter, or constraint-violation error (such as an out-of-range input, invalid state for the requested command, or missing required parameter); inspect each returned error payload and verify it contains an error class or code, a human-readable message, at least one structured key-value context field sufficient for an orchestrator to branch without parsing free text and a timing record (a device-anchored timestamp, or a monotonic event-sequence identifier where the device keeps no reliable clock). Confirm that the endpoint declares its error catalog in the machine-readable contract, so a client knows in advance which errors a call may return, and that a raised error remains retrievable after delivery (logged or persisted by the instrument or its trusted gateway) rather than surfaced only transiently. Testing a single failure type is insufficient for a Critical criterion with four sub-requirements, across which error payload structure may vary by fault category.
rationale: |-
  A closed-loop orchestrator must detect and respond to failure programmatically (Abolhasani et al., 2026). The timing record is not a duplicate of the consumer's own receipt log: the consumer already timestamps when it receives the error, and a device-anchored time or monotonic sequence in the payload is the other half of the pair, so comparing the two exposes a network stall, a high-latency link, or a device that stopped before its message arrived. This is also why a monotonic event-sequence suffices where a device cannot keep a real clock, while an undocumented free-running clock does not. Comparing the device-anchored time against the consumer's receipt time exposes gross anomalies but cannot reliably order errors arriving from different devices within a short window, because receipt time carries network delay and jitter, precisely when knowing which fault came first (root cause versus consequence) matters most. Reliable cross-device ordering instead requires the devices to share a synchronized time base (NTP as a baseline, PTP where sub-millisecond accuracy is needed), so the orchestrator can compare device timestamps directly; that shared time base is a laboratory-deployment and orchestration-layer prerequisite rather than something any single device interface can guarantee, which is why the criterion asks the device to expose its clock source, current synchronization status, a detection-time timestamp, and its timestamp uncertainty, and leaves provisioning of a common time base to the deployment. The Critical bar covers basic typed reporting, which SiLA 2's defined-error mechanism and LADS's alarm model both deliver. The fuller recovery taxonomy (transient versus permanent classification, execution-effect status, post-error device state, recovery class) is a separate Important criterion (C16) so that the procurement floor reflects what current standards can already produce.
