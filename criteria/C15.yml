id: C15
name: Control-loss observability and safe-state support
tier: Important
weight: 3
effort: M/L
summary: |-
  Control-session-loss detection and reporting; any optional non-safety-rated operational response remains configurable
applicability:
requirement: |-
  When the control session is lost, meaning the control client stops sending heartbeats or commands for a configurable interval, the instrument MUST make that loss observable: it detects the timeout and exposes a control-session-lost status through the normal status channel, so that the orchestrator or a middle-layer controller can decide on and drive the appropriate response. The safe-state decision itself is owned by the orchestrator and the workcell layer, not the instrument, because the correct response on control loss depends on the experiment phase, the state of neighboring devices, and the hazard (stopping a pump protects an overfilling reactor but can endanger a furnace that relies on it), none of which the instrument can determine on its own. Where the vendor can declare a default that is safe regardless of context for a given functional unit, the instrument SHOULD support it as a configurable, orchestrator-enabled option; such a default may be a controlled stop, hold, ramp-down, depressurization, valve closure, or continued operation, and MUST be vendor-declared and validated for the deployment. The instrument MUST NOT impose an autonomous safe-state response that the orchestrator cannot disable or override. Reconnect semantics (whether the instrument resumes, holds, or waits for explicit clearance once the session is re-established) are graded under C1 and are not re-scored here. C15 is non-safety-rated; safety-rated stop functions and certified safety responses are out of scope and belong to the workcell-level safety architecture and to C21. For instruments operating unattended with active physical hazards, buyers MUST treat C15 as a local pass floor: control-session loss must at least be observable, and a Fail is acceptable only where the loss is handled by a documented external mechanism such as a workcell-level watchdog, hardwired interlock, supervisory power-cutoff, or orchestrator-side control-loss handling.
grade_options:
- Pass
- Partial
- Fail
grading: |-
  Pass requires that control-session loss is detected and made observable through the API; a safe default is optional, and its absence does not lower the grade. Where a vendor does provide a safe default, it MUST be configurable and orchestrator-overridable rather than imposed. Partial covers a provided safe default the orchestrator cannot disable or override. Fail covers control-session loss that the instrument neither detects nor exposes, or an undocumented autonomous response on disconnect.
test: |-
  Establish a control session, sever the network connection while a long-running operation is in progress, and verify that the instrument detects the loss within the configured interval and exposes a control-session-lost status through the API on reconnect or through a side channel. Where the vendor declares a configurable safe default, verify that the orchestrator can enable and disable it, that it reaches the declared state when enabled, and that the instrument does not impose it when disabled.
rationale: |-
  In long-running unattended experiments the control client can crash or disconnect while hardware is active. The instrument cannot reliably decide what is safe in that moment, because the safe response depends on the experiment phase, the surrounding devices and the hazard, all of which live in the orchestrator and the workcell layer rather than in the instrument. What the instrument can reliably contribute is to make the loss observable so the orchestrator or a middle-layer controller can act, and, where a genuinely context-free safe default exists, to offer it as an option the orchestrator can enable. Imposing a fixed device-side response is as likely to cause harm as to prevent it, since stopping a pump can protect a reactor but disable a furnace's cooling. C15 is therefore scoped to observability and optional, overridable support, and is non-safety-rated; coordinated workcell-wide shutdown is handled by C21 and the workcell's safety-rated infrastructure. A reliable local network is assumed: control-session loss is an operational exception to be observed and handled, not a routine event to design elaborate device autonomy around.
