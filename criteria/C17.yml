id: C17
name: Conformance and certification
tier: Important
weight: 2
effort: S/M
summary: |-
  Version-tied conformance evidence for both the communication protocol and the implemented device model
applicability:
requirement: |-
  Conformance evidence SHOULD cover two distinct dimensions: (i) base-protocol conformance — independent certification or test-scenario evidence for the communication and protocol layer (e.g., OPC Foundation server certification for OPC UA endpoints; SiLA Consortium self-certification test results for SiLA 2 endpoints); and (ii) laboratory-device semantic conformance — version-tied evidence that the implemented companion specification or Feature set covers the shipped instrument (e.g., documented LADS NodeSet, profiles, facets and functional coverage; or a versioned SiLA 2 Feature set with test evidence). Base-protocol certification alone is insufficient if the exposed laboratory-device model is incomplete or undocumented. Vendor-specific Features and NodeSets are expected and legitimate, not a deficiency: these standards define how a device model is built and communicated, not which capabilities a device must expose, so a vendor's own Features are the intended way to surface functionality the standard does not enumerate. What C17 asks is that the model, whether standard or vendor-specific, be documented and conformant. Where the chosen protocol has no established third-party certification scheme or consortium self-certification suite (for example, a documented vendor protocol, REST, or bare gRPC), the base-protocol dimension is satisfied by documented, versioned and reproducible vendor conformance-test evidence rather than by formal certification; the absence of an external certification body or institution is not itself a deficiency.
grade_options:
- Pass
- Partial
- Fail
grading: |-
  Pass: documented conformance evidence for the base-protocol layer (independent third-party certification, such as an OPC UA server tested by an OPC Foundation accredited lab and published as OPC Certified; consortium conformance testing, such as SiLA 2's test scenarios run as self- or accredited certification; or, for a protocol with no certification program of its own, documented and reproducible vendor conformance-test evidence tied to the shipped firmware and standard version) together with version-tied conformance evidence for the implemented laboratory-device companion specification or feature set (a documented LADS NodeSet with profiles, facets, conformance units and shipped firmware coverage, or a versioned SiLA 2 Feature set with test evidence). Base-protocol evidence alone does not establish laboratory-device semantic conformance: an endpoint whose companion-specification or Feature-set depth is undocumented caps at Partial (P-UNDOC). Partial: base-protocol conformance present, but the laboratory-device semantic layer is incomplete, undocumented, or version-mismatched, or the certification covers an older version of the standard with a published re-certification roadmap and target date. A Partial grade MUST be annotated with one of the following reason codes: P-OLD (certification covers an older version), P-GAP (implementation or test-coverage gap), or P-UNDOC (evidence exists but is insufficiently tied to shipped firmware, or the companion-specification depth is undocumented). When comparing two Partial vendors on C17, a P-OLD Partial is generally less concerning than a P-GAP or P-UNDOC Partial, which indicates an implementation or documentation gap that may affect integration reliability. Fail: self-declared compliance without supporting evidence or test-scenario coverage of any kind. The absence of a third-party or consortium certification for the chosen protocol is not itself a Fail; what C17 requires is documented, reproducible conformance evidence appropriate to that protocol's ecosystem.
test: |-
  (a) Request evidence for the communication protocol itself: for OPC UA endpoints, the OPC Foundation certification (or Compliance Test Tool report); for SiLA 2 endpoints, the consortium's conformance test-scenario results; and otherwise (REST, gRPC, or a documented vendor protocol) the vendor's own documented conformance-test results. Verify the evidence names the specific standard version and the shipped firmware version. (b) Request evidence for the laboratory-device model layered on top: for OPC UA LADS endpoints, the implemented NodeSet file, the declared LADS profiles and facets (the named conformance groups, in OPC UA's Profile and Facet terms, that the server claims to support) and documentation of functional coverage against the shipped instrument; for SiLA 2 endpoints, the versioned Feature Definition Language files and their test output. Verify this evidence is tied to the shipped firmware and covers the functions the buyer intends to use. An endpoint that supplies (a), the protocol-layer evidence, but not (b), the device-model evidence, caps at Partial and is annotated P-UNDOC.
rationale: |-
  For the buyer, conformance evidence is what makes this scorecard cheaper to apply. A certified or conformance-tested interface has already been exercised against the standard by someone else, so the buyer does not have to re-test the whole protocol surface, gets independent quality control from a body or consortium that other integrators also trust, and has reasonable assurance the interface will interoperate with other standard-compliant, certified software rather than only the vendor's own stack. The form the evidence takes depends on the protocol: a third-party or consortium certification where the standard offers one, and otherwise documented, reproducible vendor test evidence that serves the same purpose, so the criterion does not penalize protocols that lack an external certification body.
