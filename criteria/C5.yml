id: C5
name: Control-accessible result retrieval
tier: Critical
weight: 3
effort: S
summary:
applicability:
requirement: |-
  The programmatic interface MUST provide a documented, headless path by which an external orchestrator or analysis pipeline can retrieve measurement results and metadata. If vendor libraries, services, edge-controller software, or data brokers are required to decode or serve the result, they MUST be licensed for autonomous use, callable without GUI interaction, versioned, documented, and deployable under the buyer's IT and validation constraints. GUI-only export, encrypted files readable only through interactive software, and automation-prohibitive license terms are disqualifying. Result metadata MUST include, at minimum: command or execution identifier; instrument identifier with firmware and software versions; method or program identifier and version; sample or labware identifier where the instrument is passed or senses one; start and end timestamps with time zone; the authenticated caller identity (the client or orchestrator ID or UUID, or, in regulated deployments, the credential the call authenticated with) and a human-in-the-loop indicator where the instrument is aware of manual intervention; status (complete, partial, failed, aborted); units; result payload type or format identifier; result schema or data-model version for opaque result payloads where schema evolution is possible; and quality flags (warnings, saturation, integration errors, out-of-range indicators). Sample and labware identity is owned by the orchestrator and LIMS, not the instrument: the command or execution identifier already correlates a result to the orchestrator's record of what was run, so an instrument that neither receives a labware or sample identifier nor senses one itself is not required to report one. The same applies to operator and user attribution: it is owned by the orchestrator, scheduler, and LIMS, and the instrument attaches only the caller identity it authenticated, plus a human-in-the-loop indicator where it is aware of one, not the human operator behind the call, which it may not know. All of this metadata MUST be retrievable from the interface and unambiguously bound to the result through a stable key, typically the command or execution identifier; it need not be embedded in the result payload and may instead be exposed through separate machine-readable properties or endpoints (for example, a serial-number property or a current-user query) that a client fetches and correlates.
grade_options:
- Pass
- Partial
- Fail
- N/A
grading: |-
  Pass requires headless, programmatic retrieval of the result data (the measurement payload itself) and all mandatory metadata fields, linked to the control interface. Partial requires a headless retrieval path and at minimum the traceability set (command or execution identifier, instrument identifier, status, units, and start timestamp with time zone), with no more than two other applicable metadata fields missing.

  For the purpose of the Partial grade, the applicability of metadata fields is classified as follows. Always applicable (missing any disqualifies Partial): command or execution identifier; instrument identifier; status; units; and start timestamp with time zone. Instrument-class-conditional (applicable when the instrument class supports it): method or program identifier and version (instruments that execute parametric methods: HPLCs, plate readers, incubators, liquid handlers, centrifuges with programmable protocols; not applicable to fixed single-mode instruments such as dispensers, sealers, balances, basic spectrophotometers, pH meters); sample or labware identifier (only instruments that echo an identifier they were given or sense one themselves, such as barcode- or RFID-equipped plate hotels, incubators, biobank stores, or autosamplers); schema or data-model version (required only where the result is delivered as an opaque payload, such as a binary blob, JSON dump, or XML dump, that the interface contract does not type; where the result is typed by the interface's own machine-readable definition, such as a SiLA Feature or an OPC UA module or information model, that definition's version already serves as the schema version and no separate field is required. For an opaque payload whose schema can evolve, a vendor may declare the schema fixed and non-evolving only with a published, versioned schema document and a documented policy stating the schema is frozen, in which case the version field may be omitted but the full schema MUST be referenced by a stable, resolvable identifier in the result metadata); and quality flags (instruments that can detect saturation, integration errors, or out-of-range conditions). Deployment-conditional: authenticated caller identity (client or orchestrator ID/UUID, or the authenticating credential in regulated deployments) and a human-in-the-loop indicator where applicable (multi-user or regulated deployments); end timestamp (where the instrument reports completion time separately from start time). The two-field ceiling for Partial applies only to instrument-class-conditional and deployment-conditional fields that are applicable to the instrument under evaluation; missing always-applicable fields falls to Fail regardless of count. Fail covers GUI-only retrieval, manual-export-only workflows, or the minimum traceability identifiers not being obtainable from the interface and bindable to the result.
test: |-
  Retrieve a representative result through the control interface from a non-vendor host using only programmatically callable, license-compliant tooling. If vendor libraries or services are involved, verify that they can be invoked headlessly under the buyer's IT and validation constraints. Inspect the metadata against the mandatory list above, whether it is returned with the result or fetched from separate interface properties or endpoints and correlated to the result.
rationale: |-
  Autonomous analysis pipelines must retrieve instrument output through a documented, headless, programmatically addressable path linked to the command or execution identifiers used by the control interface; Abolhasani et al.\ flag proprietary, encrypted exports as an obstacle to autonomous operation .
