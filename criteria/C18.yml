id: C18
name: Operating-system independence
tier: Important
weight: 2
effort: S/M
summary: |-
  OS-neutral network access or open-server-OS bindings, with host dependencies and support windows disclosed
applicability:
requirement: |-
  The device's programmatic control path (its API, SDK, or driver, together with any host-side runtime it requires) MUST be operable from a mainstream, automatable host without being locked to a single proprietary operating system. Specifically: (a) the device MUST be controllable either as an operating-system-neutral network service reachable from any client operating system (for example a documented SiLA 2, OPC UA, or REST endpoint), or through client bindings that run on at least one open, scriptable, server-class operating system (for example a current Linux distribution); (b) where a vendor-supplied host component (SDK, driver, or service) is required, the vendor MUST document its supported operating systems and their support windows; and (c) the vendor MUST document any dependency on a single proprietary operating system (which component, and its support window); documentation is a minimum disclosure obligation and does not by itself satisfy the criterion. A control path operable only through an operating system's GUI, rather than a headless, scriptable interface, does not meet this requirement regardless of documentation and is graded Fail. Exposing the device as a headless, scriptable network service satisfies this criterion for all clients even if the vendor's own server component runs on one operating system, provided that component is documented and automatable (the edge-controller path of C1).
grade_options:
- Pass
- Partial
- Fail
grading: |-
  The grading turns on the client-facing control path, not on where the vendor's server runs. Pass requires an operating-system-independent control path: either the device is an operating-system-neutral network service reachable from any client operating system, in which case a documented, automatable vendor server component running on a single operating system is acceptable (the edge-controller path of C1), or the client SDK and bindings run on at least one open, automatable server operating system; supported operating systems and their support windows must be documented. Partial is reserved for operating-system lock-in in the client or control path itself, for example client bindings that run only on a single proprietary operating system, where that dependency is headless, scriptable, and documented with its support window. Fail covers operation that requires a specific proprietary operating system through GUI-only automation, a control path that depends on an undocumented operating-system-locked component, or system requirements that do not document the supported operating systems at all.
test: |-
  Read the vendor's stated system requirements for the control interface and for any host-side SDK, driver, or service. Confirm that at least one automatable, server-class operating system is supported on the client side, or that the device is reachable as an operating-system-neutral network service. Where feasible, exercise the control path from a non-Windows host (a Linux client, or the network API from a Linux client) and confirm that a command executes and a result returns with no single-operating-system-only component in the client path.
rationale: |-
  Operating-system lock-in is a recurring, under-stated integration tax. A device whose control stack runs only on one proprietary desktop operating system forces the laboratory to provision, license, patch, and secure a dedicated host per instrument, enlarges the lifecycle and security surface, and ties the automated laboratory's uptime to a single vendor's operating-system-support decisions. None of this prevents closed-loop operation, which is why the criterion is Important rather than Critical, but it materially raises cost and fragility and narrows deployment options for Linux-based and budget-constrained self-driving laboratories. Exposing the device as an operating-system-neutral network service (C1, C6) is the clean remedy, because it decouples the client ecosystem from the host operating system even when a vendor server component remains operating-system-specific.
