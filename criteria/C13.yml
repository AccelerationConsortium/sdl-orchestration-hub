id: C13
name: Versioning discipline
tier: Important
weight: 2
effort: S/M
summary: |-
  Version pinning, published versioning and deprecation policies, with deployment-appropriate support commitments
applicability:
requirement: |-
  The interface SHOULD follow a published versioning policy (semantic versioning is the practical default) with a published long-term-support commitment. The property that matters most to a deployment is that a working integration can stay on the interface version it validated: the vendor SHOULD NOT force a breaking change onto a running deployment, whether by a mandatory update or by a server-side or cloud change a pinned client cannot decline, and breaking changes SHOULD instead land in new versions the user opts into. A vendor may release breaking changes at any pace as long as deployments can remain on their validated version. Advance notice is needed for the case that removes that option, namely the vendor ending support for or requiring migration off a running version: for research-only deployments, a deprecation notice at least one minor release ahead; for regulated or validated deployments, at least 12 months' notice, a supported overlap period during which both the old and new interface remain available and a documented migration and validation guide, so the deployment can plan and re-validate.
grade_options:
- Pass
- Partial
- Fail
grading: |-
  Pass requires a published versioning policy, a changelog, a deprecation policy, and that a deployment can remain on the interface version it validated rather than being forced to adopt breaking changes. Where the vendor ends support for or requires migration off a running version, research-only deployments additionally require at least one minor release of notice, and regulated or validated deployments additionally require a long-term-support commitment, at least 12 months' notice, an overlap period during which old and new interfaces remain available and a documented migration and validation guide. Partial covers a policy that lets a deployment pin its validated version but does not meet the deployment-appropriate forced-migration conditions: for a research-only deployment, missing the one-minor-release deprecation notice; for a regulated or validated deployment, missing the long-term-support commitment, the 12 months' notice, the overlap period, or the migration and validation guide. For a research-only deployment the regulated guarantees are not required, and their absence is not itself a downgrade. Fail covers no published versioning or deprecation policy, or a vendor that forces breaking changes onto running deployments through mandatory updates or undeclinable server-side changes.
test: |-
  Check the vendor's published changelog and deprecation policy, and whether a deployment can remain on a validated interface version, that is, whether the vendor imposes mandatory updates or undeclinable server-side changes that would force a running integration to adopt breaking changes.
rationale: |-
  Abolhasani et al. (2026) list "backward compatibility, stable versioning, long-term support" as components of a mature autonomous-instrument industry. The risk to a production deployment is not that a vendor releases breaking changes but that it forces them onto a running, validated integration. In regulated settings a working setup is often frozen and never updated, so a vendor can iterate freely as long as the deployment can stay on the version it validated; what blocks production is a vendor that ends support for or pushes breaking changes onto that version with no option to remain and no time to plan a re-validated migration.
