id: C9
name: Concurrent-access discipline
tier: Important
weight: 2
effort: M
summary: |-
  Atomic locking or documented single-controller exclusion, with ownership, lease and reconnect behavior and gated clearing where provided
applicability:
requirement: |-
  The interface SHOULD expose device-local lockable resources or functional units, with: (a) atomic acquire/release operations; (b) queryable lock state and owner or session identity; (c) documented lease and reconnect behavior, specifying whether the lock releases on TCP drop, after a configured grace period, or only on explicit release; and (d) a documented preemption or administrative-clear mechanism by which an authorized higher-priority client can interrupt a held lock. For instruments with independent functional units (e.g., a liquid handler's deck transport and plate hotel, or a multi-module robotic workcell with independently commanded arms), each independently controllable unit SHOULD be lockable separately. (Instruments in which the vendor's session model explicitly prevents concurrent multi-client access to individual modules—such as most commercial HPLC systems—are not examples of independently lockable units and should be evaluated as single-controller devices under the alternative path.) Composite reservations MAY be exposed by the vendor, but multi-device reservation, global lock graphs, deadlock detection, priority scheduling, and fairness are orchestrator-layer responsibilities and are out of scope for this criterion.

  Where the instrument is a single-controller device by design, the API MAY explicitly reject multi-client connections in lieu of (a)–(d), provided the endpoint still exposes busy and owned state, lease and reconnect behavior and, where a privileged administrative-clear path exists, a role-gated one; the rejection mechanism itself MUST be documented. It SHOULD additionally expose owner or session identity (or at least an opaque owner token) and read-only monitoring access, so that a second client can see that the device is in use and by whom. Any preemption or administrative-clear path MUST be role-gated. The action SHOULD be attributable, meaning the API reports the preempting client's identity or session token, the affected lock or resource, the timestamp and the reason code where available, so that the integration layer or scheduler can record it; the persistent audit log is that layer's responsibility, not the device's, and an on-device audit log is not required. Even under 21 CFR Part 11 the audit trail is an obligation of the controlling software (the integration layer, scheduler, or LIMS), not the instrument firmware, and buyers should evaluate it in their deployment-level Computer Systems Validation (CSV) process rather than as a vendor scorecard criterion.
grade_options:
- Pass
- Partial
- Fail
grading: |-
  Pass requires documented behavior on (a)–(d), or, for declared single-controller devices, documented rejection behavior plus busy and owned state and lease and reconnect behavior; owner identity or token and read-only monitoring access are a SHOULD, and where the device architecture genuinely cannot expose them, their documented absence is an accepted Pass-path exception rather than a downgrade. Any preemption or administrative-clear path MUST be role-gated. Partial covers documented behavior on a subset of (a)–(d), a documented LockController-style primitive without sub-criterion-level detail, a single-controller declaration that omits owner-identity or monitoring exposure the device could support, or a role-gated preemption path whose actions the API does not make attributable. Fail covers no documented concurrency model at the device level, or an ungated preemption or administrative-clear path by which any client can force-clear another's lock.
test: |-
  For multi-client endpoints: (a) connect two clients, acquire a lock from the first, and verify the second can read the lock state, and the owner identity where the device exposes it; additionally verify atomic acquire semantics by issuing simultaneous lock-acquire requests from two clients using separate threads or processes with synchronized start times, and verify that exactly one receives a success response and the other receives a typed rejection error; a race condition that allows both clients to succeed concurrently is a Fail on sub-criterion (a) regardless of sequential lock-state visibility. (b) Acquire a lock, drop the TCP connection, reconnect, and verify the documented behavior matches what the vendor specifies. (c) With a lock held by one client, issue a privileged preemption or administrative-clear command from a second client and verify the documented path; additionally, attempt the same clear from an unauthorized (non-privileged) client and verify that it is rejected, since the administrative-clear path MUST be role-gated. (d) For instruments with multiple independently controllable functional units, acquire locks on each unit independently. For declared single-controller devices, verify the documented rejection behavior, busy and owned state, lease and reconnect behavior, the read-only monitoring path and owner identity or token where available and, for any privileged administrative-clear path, that it is role-gated and its actions are attributable through the API, rather than the multi-client lock test.
rationale: |-
  A single integration layer that owns a device can serialize access to it, and in most deployments that is where concurrency coordination, preemption policy and audit belong. Device-local support still earns its place for two reasons: an instrument may be reached by more than one client at once (several orchestrators, ad-hoc scripts, or AI agents alongside the scheduler), and even a single scheduler benefits from seeing that a device is busy and who holds it and from atomic acquire/release that prevents a race if two clients arrive together. The point of C9 is that the device exposes enough concurrency state to support the integration layer, not that it reimplements the layer's job: multi-device reservation, global lock graphs, deadlock detection, priority, fairness, and the persistent audit log are all integration-layer responsibilities. SiLA 2 includes a LockController Standard Feature (Juchli, 2022; Hinkel et al., 2023) and OPC UA supports access control as part of LADS (Brendel et al., 2022), but neither standardizes lock state and ownership reporting or lease/reconnect behavior in the depth production deployments benefit from.
