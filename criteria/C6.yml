id: C6
name: Runtime self-description
tier: Important
weight: 2
effort: S
summary: |-
  Runtime capability introspection matching the deployed firmware, installed hardware and module configuration
applicability:
requirement: |-
  The instrument MUST expose its command surface, parameter types, and currently available state at runtime so that a generic client can build a technical control interface with minimal device-specific driver code. Scientific use still requires method documentation, calibration context, and safety constraints. Two sub-tests apply, separating whether a generic client can discover the interface (a) from whether what it discovers is faithful to this particular unit (b). Sub-test (a) Capability introspection. A generic client MUST be able to introspect the command surface, parameter types, return types, units and constraints implemented by this firmware on this hardware. Sub-test (b) State-aware availability. The endpoint MUST expose the operations valid for the instrument's actual hardware and module configuration, resolved at startup, so that a generic client sees only the capabilities the deployed configuration supports rather than operations that absent or unconfigured modules cannot perform. The endpoint SHOULD further reflect transient, state-dependent unavailability where the device can determine it (an open door, a held lock, an in-progress operation, or expired calibration), so that a client can hide or disable those operations rather than fail at call time; where it cannot, such conditions surface as typed errors at call time (criterion C3).
grade_options:
- Pass
- Partial
- Fail
grading: |-
  Pass requires both sub-tests. Partial covers either (a) without (b), or static contract description (OpenAPI, JSON Schema, or IDL) without runtime introspection. These two Partial cases represent substantially different integration burdens and should not be treated as equivalent: a vendor with runtime-capable introspection but without state-aware availability (sub-test (a) without (b)) provides a programmable, discoverable control surface whose state-gating failures surface at call time; a vendor with only a static contract description provides a machine-readable schema the client can be built against, but not a live interface the client can query at runtime, so the client is fixed to the documented contract and cannot adapt to the instrument's current capabilities and state. When two vendors both score Partial on C6, buyers should record which of the two cases applies and note it in the evaluation record. Fail covers no machine-readable contract at all.
test: |-
  For (a), connect a generic client (SiLA Browser, UaExpert, or the vendor's own reference client) and introspect the interface; verify that the commands, types, return types, units, and constraints are reported. For (b), test configuration-aware exposure by detaching or disabling a module (or by evaluating a unit delivered in a different module configuration) and power-cycling, then confirming the endpoint exposes only the operations valid for the resulting configuration and not those of the now-absent module. Transient, state-dependent reporting (operations momentarily blocked by an open door, a held lock, or an in-progress operation) is a SHOULD; where the device supports it, drive it into such a state and verify the affected operations are reported as unavailable, but its absence does not lower the (b) grade.
rationale: |-
  Runtime self-description is the central design goal of SiLA 2's Feature Definition Language (Juchli, 2022; Hinkel et al., 2023) and of LADS's Information Model (Brendel et al., 2022). SiLA 2 and OPC UA with LADS provide the foundation for Pass-level capability introspection by design; Pass-level state-aware availability additionally requires that the exposed surface reflect the instrument's actual module configuration rather than a generic superset; reflecting transient, live device state (locks, open doors, in-progress operations) is a further, more demanding SHOULD. A REST-plus-OpenAPI interface can pass sub-test (a) when the OpenAPI document is served by the running controller and accurately lists the command surface and types the deployed firmware exposes. Sub-test (b) is the stricter condition: that served document must be scoped to the instrument's actual module configuration, listing only the operations its installed modules support rather than a generic product-family superset; a firmware-accurate document that still advertises endpoints for modules the unit does not have passes (a) but not (b).
