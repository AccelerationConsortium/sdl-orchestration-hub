id: C4
name: Open API access
tier: Critical
weight: 6
effort: M/L
summary: |-
  Included baseline autonomous API access; reusable and publishable buyer-written integrations; no baseline deployment royalties; documentation where required
applicability:
requirement: |-
  Full programmatic access MUST be available under commercial and licensing terms that permit autonomous operation; here, "contract" means the procurement package, service contract and end-user or API license, not the technical interface contract. Three sub-tests apply. Sub-test (a) No hidden service- or add-on contract paywall. API access required for the buyer's intended autonomous operation MUST be included in the quoted procurement package, with no post-purchase gating of capabilities advertised at the time of purchase. This sub-test targets gating of that baseline autonomous access; it does not prohibit separately priced optional services that leave the baseline intact, such as a regulated-environment support and validation package (GxP, IVD) under which the vendor assumes liability, optional feature updates or upgrades, or a third-party-supplied interface where the vendor itself offers none. Such services may carry a fee, provided the autonomous access included in the quoted package is not itself withheld behind them; per-deployment royalties on that baseline access remain disqualifying. Sub-test (b) License permits ecosystem use. The API license MUST permit publication and reuse of buyer-written integration or adapter code (excluding redistribution of vendor confidential source code, proprietary binaries, or confidential documentation), third-party orchestration, and use without per-deployment royalty. Field-of-use restrictions that prevent reusable buyer-written integration code, restrict multi-tenant deployment, or impose per-deployment royalties are disqualifying. Sub-test (c) Integration documentation included. The procurement package SHOULD include the integration manual and interface documentation at no additional cost, and MUST include them at no additional cost where the interface is not self-descriptive at runtime (criterion C6), since such an interface cannot be integrated without them.
grade_options:
- Pass
- Partial
- Fail
grading: |-
  Pass requires sub-tests (a) and (b) to pass, with the procurement package and license terms explicit at bid time; where the interface is not self-descriptive at runtime, sub-test (c) is also required, and an integration manual that is absent or available only for an extra fee is then a Fail, because the interface cannot be integrated without it. Where the interface is self-descriptive, sub-test (c) is a SHOULD: a paywalled or missing manual is recorded as a gap but does not by itself Fail C4. Partial is reserved for cases in which ambiguous clauses exist but the vendor provides a written contract amendment before purchase. A clause is ambiguous within the meaning of this criterion only when its scope is genuinely unclear and the restriction, if the clause were interpreted most broadly, would not independently qualify as a Fail condition. A clause that, under any plausible interpretation, imposes one or more Fail conditions — field-of-use restriction on buyer-written integration code, per-deployment royalties, or restriction to vendor-approved integrations — is Fail regardless of a vendor's offered amendment, unless the amendment fully removes the clause rather than merely clarifying its scope. Fail covers any of: API access unavailable for the intended workflow, gating after purchase, restriction to vendor-approved integrations, per-deployment royalties, or prohibition on publication or reuse of integration code.
test: |-
  Review the end-user license and service contract for paywall clauses (sub-test a) and for field-of-use, redistribution, and publication clauses (sub-test b); require a written exception from the vendor for any clause that restricts either. Determine whether the interface is self-descriptive at runtime (C6); where it is not, sub-test (c) is mandatory, so verify that the integration manual and interface documentation are included in the quoted package at no additional cost.
rationale: |-
  Contractual gating effectively removes the instrument from the open SDL ecosystem; Abolhasani et al. (2026) identify this as a specific obstacle. C4 carries the highest weight (6) because contractual restriction cannot be remedied by engineering work after purchase.
