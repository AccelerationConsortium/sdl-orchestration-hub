id: C7
name: Observable command and property state
tier: Important
weight: 2
effort: S
summary: |-
  Concurrent non-blocking execution status and progress subscriptions, with recommended property and event subscriptions
applicability:
requirement: |-
  At minimum, a long-running command's execution state SHOULD be observable as a coarse status (for example, running, idle, complete, or failed) that a client can query concurrently while the command is in progress, without blocking the query until command completion. Beyond this baseline, and where the instrument can provide it, the interface SHOULD additionally expose finer phase or progress, intermediate values, and—only where the instrument can compute it meaningfully—estimated remaining time and/or progress, through a subscription mechanism rather than only a terminal return value. Estimated remaining time is optional: where it cannot be meaningfully computed (equilibration, adaptive imaging, temperature stabilization), the interface SHOULD report it as unknown rather than fabricate a value, and the absence of a time estimate is never penalized. To help an orchestrator schedule, the interface SHOULD also expose, where it can compute one, an estimated duration for an operation from its parameters before the operation starts, reported as unknown where none can be computed; committing to and reserving future time slots across devices remains an orchestrator responsibility (C9), not the device's. For instruments whose operations involve hazardous actuation or block shared resources—including, as a practical heuristic, operations that routinely run beyond approximately 60 seconds—C7 MUST score at least Partial unless the hazard or resource blocking is handled by a documented external mitigation; the minimal concurrent running/idle status above is sufficient to meet this floor, and richer progress reporting earns Pass. A documented external mitigation (for example an institutional interlock or a supervisory controller that bounds the hazard or serializes access to the shared resource) satisfies this local floor as a recorded deployment decision, in the same way as the C15, C20 and C21 mitigations; it does not change the C7 grade the endpoint earns. The 60-second value is a heuristic, not a principled threshold: the property that actually drives the local floor is whether the call blocks a shared resource or involves hazardous actuation, not duration alone. The same subscription discipline SHOULD extend beyond commands: continuously varying or sensor-like values the instrument exposes (temperatures, pressures, levels, positions) and asynchronous conditions (alarms, notifications, state changes) SHOULD be observable through a subscription, server-pushed on change or at a configurable interval, rather than requiring client-side polling.
grade_options:
- Pass
- Partial
- Fail
- N/A
grading: |-
  Pass requires both sub-requirements: subscription-based progress reporting during long-running commands, and concurrent status queries that return within the documented response interval without blocking on command completion. A coarse but concurrently queryable running/idle/complete status satisfies the second sub-requirement on its own and earns at least Partial. Partial covers either sub-requirement satisfied but not both. Fail covers neither sub-requirement: no progress reporting and no ability to issue non-blocking status queries while a command is running. For instruments with no long-running commands and no observable sensor-like properties (operations complete effectively instantaneously and the device exposes no continuous readings), the progress and subscription sub-requirements do not apply and C7 is graded N/A; where such an instrument exposes observable properties but no long-running commands, C7 is graded on the property-subscription discipline alone.
test: |-
  Invoke a multi-step command (a temperature ramp, a plate scan, or equivalent) and verify that progress updates stream to the client. While the command is in progress, issue a concurrent status query from the same client session, or, for endpoints that advertise multi-client support, from a second client, and verify that the query returns within the documented response interval rather than blocking until the long-running command completes. Where the instrument exposes an observable property (a sensor reading such as temperature or pressure), subscribe to it and verify it pushes updates on change or at a configurable interval while the subscription is active, rather than requiring the client to poll.
rationale: |-
  Subscription-based state makes orchestrators more efficient by allowing decisions during an experiment rather than after it completes, a feature that SiLA 2 formalizes in its observable commands (Juchli, 2022; Hinkel et al., 2023) and that OPC UA supports through subscriptions on any exposed variable, including command or program status. Client-side polling of a terminal return value can substitute at higher resource cost, which is why this is Important rather than Critical. Because the criterion is graduated, an instrument exposing only a coarse, concurrently queryable state still earns partial credit; full progress streaming distinguishes Pass and is an orchestration convenience, not a procurement floor. The same efficiency argument extends to properties and events: subscribing to sensor values, alarms, and notifications avoids the cost and integration burden of client-side long-polling, and both SiLA 2 (observable properties) and OPC UA (subscriptions, events, and alarms) support it natively. Like the richer command reporting, this is a SHOULD rather than a procurement floor and does not gate the criterion.
