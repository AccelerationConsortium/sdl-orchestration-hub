id: C2
name: Strong typing with units and constraints
tier: Critical
weight: 3
effort: S
summary: |-
  Typed inputs and outputs; machine-readable units, constraints, precision and resolution; runtime validation and reported defaults
applicability:
requirement: |-
  Parameters and return values MUST have declared types. Physical quantities MUST use a declared unit vocabulary (UCUM, SI-derived identifiers, QUDT, SiLA 2's FDL Unit constraint — which defines each unit as a machine-readable decomposition into SI base units with a conversion factor and offset — OPC UA EUInformation mapped to UNECE unit codes, or another documented equivalent whose unit identifiers are unambiguous and machine-readable); free-text unit strings disqualify, and so does declaring a type or unit only in human-facing documentation (a datasheet or integration manual) instead of in the machine-readable interface contract. Here, machine-readable means retrievable through the endpoint's introspection or schema by a generic client at runtime; a value stated only in prose documentation is not introspectable, not enforceable, and not part of the typed contract. Precision and resolution MUST be machine-readable; rounding behavior SHOULD be machine-readable where the interface format provides a dedicated field for it. Dimensional compatibility and allowed conversions SHOULD be machine-readable where the declared vocabulary encodes dimensional relationships (e.g., QUDT-backed dimensional analysis); where the chosen vocabulary does not encode those relationships, the interface is not penalized for their absence, provided the declared unit identifier is unambiguous: an unambiguous identifier still lets a client application or agent resolve the unit's dimension and conversion factors (from the declared vocabulary or a standard unit reference) and apply conversions reliably, dynamically, and generically. The interface therefore does not have to carry the unit's dimensional decomposition itself, as SiLA 2's FDL does; an unambiguous identifier the client can resolve is sufficient. Constraints (ranges, enumerations, nullability, regular expressions) MUST be machine-readable, and the interface MUST also validate them at runtime: an input that violates a declared type, range, enumeration, or unit constraint MUST be rejected with a typed error rather than silently coerced, truncated, or accepted. Defaults MUST NOT be applied silently. For an omitted recognized parameter that has a default declared in the machine-readable contract, the interface MUST apply that declared default and report the value actually applied; where no default is declared, or where the parameter name is unrecognized, the interface MUST raise a typed error rather than silently substitute a value. For instruments whose operations involve spatial positioning of labware or samples (carousels, racks, plate hotels, autosamplers, robot-served instruments), coordinate frames and the positions of the instrument's carrier sites or nests (the fixed locations where labware is held, such as deck positions or carousel slots) SHOULD be declared with the same machine-readable discipline as units. The instrument MAY be agnostic to the labware itself, including its identity and dimensions, but SHOULD expose where each carrier site or nest is located.
grade_options:
- Pass
- Partial
- Fail
grading: |-
  Pass requires all MUSTs satisfied: declared types for all parameters and return values; unit identifiers from the declared vocabulary (no free-text strings); machine-readable precision and resolution; machine-readable constraints (ranges, enumerations, nullability); and runtime validation of declared constraints, demonstrated by an invalid input being rejected with a typed error rather than silently coerced, truncated, or accepted. Machine-readable rounding behavior is a SHOULD where the interface format provides a dedicated field for it; its absence does not affect the grade. Partial covers declared types and unit vocabulary present, but one or more of the following not machine-readable: precision or resolution; range constraints; enumeration or nullability constraints. A vendor who meets types and units but exposes constraints only in free-text documentation scores Partial, as does a vendor whose constraints are machine-readable but not enforced at runtime (invalid inputs are silently coerced, truncated, or accepted rather than rejected with a typed error). An interface that applies a declared default without reporting the value used caps at Partial; silent substitution of an undeclared value, with no error and no report, is Fail. Fail covers absent or free-text unit identifiers, types or unit identifiers declared only in documentation rather than in the machine-readable contract, no declared types, or no machine-readable contract at all.
test: |-
  Use the endpoint's introspection mechanism or machine-readable contract to retrieve metadata for at least one unit-bearing input parameter and one unit-bearing response value where the instrument exposes them (a read-only sensor may have no physical-quantity input, and a pure actuator may have no measurement response; check whichever it exposes), and verify the metadata includes declared type, unit identifier from the declared vocabulary, numeric range, precision and resolution and nullability or enumeration constraints; additionally verify rounding behavior is machine-readable where the interface format provides a dedicated field for it. Then submit an input that violates a declared constraint (an out-of-range numeric value or an invalid enumeration member) and verify it is rejected with a typed error rather than silently coerced, truncated, or accepted. Additionally, omit a parameter that carries a declared default and verify the applied value is reported back; submit an unrecognized parameter and verify a typed error rather than a silently substituted value.
rationale: |-
  Autonomous orchestrators generate experiment parameters algorithmically, and silent truncation or undefined behavior on invalid inputs leads to wasted experiments or hardware damage (Abolhasani et al., 2026). Machine-readable declaration does not by itself guarantee enforcement: SiLA 2 and OPC UA LADS standardize the declaration of types, units, and constraints, but neither requires the server to validate those declarations at runtime or to reject a violating input with a typed error, and generated server stubs do not necessarily do so. A fully standards-conformant interface can therefore still be sloppy, declaring constraints and units it does not enforce, which is why enforcement is tested directly rather than assumed; an interface that declares but does not enforce is a remediation target (a Partial), not an automatic disqualification (a Fail). SiLA 2's FDL Unit constraint and OPC UA's EUInformation structure mapped to UNECE unit codes are accepted equivalents under this criterion, but they differ in how much they encode. SiLA 2 defines each unit by decomposition into SI base units (an integer exponent on each base unit, plus a conversion factor and offset), so the dimensional signature and the unit conversions are themselves machine-readable, and the dimensional-compatibility SHOULD does apply to SiLA 2 endpoints. OPC UA's EUInformation, by contrast, references a flat UNECE code list with no dimensional decomposition, so the dimensional-compatibility SHOULD does not apply to endpoints relying on it alone (Juchli, 2022; Hinkel et al., 2023; Brendel et al., 2022).
