id: C14
name: Simulation or emulation mode
tier: Important
weight: 3
effort: M
summary:
applicability:
requirement: |-
  The instrument SHOULD ship with a simulator or emulator (a virtual device) that exposes the same programmatic interface as the physical device, with: (a) configurable failure injection that exercises each top-level documented error class and a representative set of instrument-class-specific faults agreed during procurement; (b) deterministic event-ordering semantics: command-state revisions, event-sequence identifiers, and progress values MUST be non-decreasing over the lifetime of a command; for multi-phase commands (e.g., an HPLC running equilibration then gradient, or a plate reader running autofocus then kinetic acquisition), the declared progress dimension MUST be monotonic across the entire command lifetime; if the vendor instead reports per-phase progress that resets between phases, each phase MUST be declared as a named, separately observable sub-unit with its own independent progress sequence; (c) state-machine fidelity for door, access, and motion operations; and (d) a drop-in interface that can replace the physical instrument without changes to client code. Timing fidelity is not required.
grade_options:
- Pass
- Partial
- Fail
grading: |-
  Pass requires (a)–(d). Partial covers a drop-in simulator (d) that can be made to fail, whether through configurable injection (a) or only by feeding it invalid inputs or invalid command sequences, but that does not meet all of (a)–(d); where configurable injection is absent, note that as the specific gap. Fail covers no simulator, a simulator that is not a drop-in replacement, or one that only ever returns success and cannot be made to fail.
test: |-
  Drive the simulator through a representative workflow that includes at least one induced failure, and verify that the simulator reports the failure with the same payload structure the physical instrument would. Where the simulator does not support configurable failure injection, the test reduces to: drive the simulator through a representative successful workflow and verify the drop-in interface is correct; check whether failures can still be provoked by feeding the simulator invalid inputs or invalid command sequences (for example an out-of-bounds parameter or a state-machine violation); note the absence of configurable failure injection as the documented basis for Partial rather than Pass. A simulator that cannot be made to fail at all is Fail.
rationale: |-
  Simulator provision is a gateway to the emerging practice of digital twins for autonomous laboratories . A simulator that always returns success is worse than no simulator: it gives developers false confidence that integration is correct when no failure path has been exercised. Concrete simulator affordances exist across the landscape: SiLA 2 defines a SimulationController Standard Feature ; the UniteLabs Platform and Connector Development Kit ship a device mock in the client-side Python SDK and a simulator on the connector side ; PyLabRobot exposes a browser-based simulator ; and Opentrons provides a simulator mode and a full hardware emulator .
