id: C11
name: Result addressability and durability
tier: Important
weight: 2
effort: M
summary:
applicability:
requirement: |-
  C11 concerns the instrument's delivered results, meaning the data products it is built to output. It does not require the instrument to also expose internal or raw working data that is not part of that delivered result, for example the raw detector trace behind a plate reader's processed absorbance values, the raw detector counts behind an HPLC or mass-spectrometer chromatogram, or the raw imaging data behind a sequencer's base calls; programmatic retrieval of the delivered result itself is still required under C5. Each result SHOULD carry a stable identifier and be linked to the command that produced it. At minimum, the most recent result SHOULD remain retrievable by that identifier across a client or instrument restart; instruments are not expected to retain their full result history, and whatever retention window they provide SHOULD be documented, with persistent storage of all results being the responsibility of the orchestrator, LIMS, or data store rather than the instrument. For instruments that produce results incrementally (a plate reader measuring well by well, an HPLC building a chromatogram point by point, an NMR accumulating scans, or a sequencer producing reads), each increment MUST become available through the API as soon as it is produced, ideally through a subscription the orchestrator can consume rather than by repeated polling, so that the orchestrator can act on early data, for example aborting a run once enough wells are read or a chromatographic peak has eluted, to save time and consumables. Results from a failed or aborted run MUST be retrievable up to the point of failure. An instrument that by design returns only a final or processed result is a legitimate run-completion-category instrument, scored on the addressability and durability of that final result alone and not penalized for withholding intermediate data; this category includes instruments that return a single instantaneous measurement (such as a balance reading) and instruments that perform on-board processing and surface only the processed signal rather than the underlying raw stream.
grade_options:
- Pass
- Partial
- Fail
grading: |-
  Pass requires that a result is addressable by a stable identifier and remains retrievable by that identifier after the client restarts and after the instrument itself restarts; for instruments that produce intermediate or progressive results, in-flight access to those increments (by subscription or polling) is additionally required. Partial covers stable-identifier addressability that does not survive a restart; or in-flight increment access for an applicable instrument class delivered without command-result linkage; or stable-identifier addressability that survives restarts but provides no in-flight access to increments for an instrument in the intermediate-or-progressive-results category. (This third case is the most common real-world gap: instruments such as plate readers and NMRs that expose stable, durable result identifiers but no way to read increments while the run is still running.) Fail covers no stable-identifier addressability at all.
test: |-
  Applicability depends on instrument class. An instrument is in the "intermediate or progressive results" category when it can expose intermediate data values through the API during command execution — not only as a terminal payload at run completion; instruments that return a single result payload only after the run ends are in the run-completion category. For instruments in the intermediate or progressive results category (e.g., plate readers doing a kinetic absorbance series, NMRs accumulating FIDs during a multi-hour 2D experiment, HPLCs streaming a UV trace during a gradient run), start a multi-step run and verify that increments become available through the API as they are produced, by subscription where the instrument supports one and otherwise by polling; then kill the orchestrator client mid-run, restart the client, and retrieve the partial result by its identifier. For instruments that produce results only at run completion, execute a run, restart the orchestrator process between run completion and retrieval, and retrieve the result by its identifier from a fresh client. Additionally, for both instrument categories, power-cycle the instrument after a completed run and verify that the result remains retrievable by its identifier from a fresh client session after the instrument restarts. Where power-cycling the instrument pre-purchase is not feasible, the evaluator SHOULD request documentation of the instrument's result-storage architecture (volatile versus non-volatile) and treat the absence of non-volatile result storage as a documented gap contributing to Partial rather than Pass.
rationale: |-
  Programmatic retrievability (C5) is necessary but not sufficient. The orchestrator needs to correlate commands with their results, read long acquisitions in flight (by subscription where the instrument supports one, otherwise by polling), and recover the output of an interrupted run through the API rather than by hand. LADS defines program and result management in its information model , but these are optional model elements rather than enforced requirements, so procurement still has to verify that a device actually implements them and check the operational details. Exposing in-flight increments is expected only where it is part of the instrument's intended output model; an instrument that surfaces only a final or processed result, whether by design or because of on-board processing, is scored on that result alone.
