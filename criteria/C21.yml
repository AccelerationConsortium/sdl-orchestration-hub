id: C21
name: Safety-event participation
tier: Cell-integration
weight: 2
effort: L
summary: |-
  Where applicable, latched hardware-stop reporting and clearance behavior, plus timed orchestrator-issued operational shutdown
applicability: |-
  C21 applies to instruments that can create a hazard the workcell must be able to stop: those with active or hazardous actuation, hazardous energy output, robot interaction, or a stop function wired into the workcell. Typical in-scope instruments are liquid handlers, centrifuges, robotic arms, plate and tube handlers, automated storage and retrieval systems and instruments with high-pressure pumps, heaters, lasers, or other hazardous energy, especially when deployed inside a robotic workcell with a shared emergency-stop or safety bus. C21 is N/A in its entirety for instruments with none of these: no active actuation, no hazardous energy output, no robot interaction and no externally relevant stop function. Typical N/A examples are balances, barcode readers, passive cameras and non-actuated sensors (simple temperature probes, conductivity sensors, and similar). For such instruments, the relevant interface obligations are instead: expose communication-loss status through the normal status channel; qualify readings with a data-validity or staleness indicator; avoid returning unqualified stale measurements after a communication gap; and recover to a valid reporting state without requiring manual intervention after reconnect. These are data-quality obligations for passive instruments; they build on the control-loss observability of C15 and the observable-state discipline of C10, but go beyond what those criteria score for actuating instruments, so for a passive instrument the buyer SHOULD evaluate them explicitly (staleness qualification, suppression of unqualified stale readings, and recovery to valid reporting after a communication gap) rather than assume they are captured by the C15 and C10 scores. The N/A determination MUST be documented with the same vendor-verification path required for sub-test (a) N/A below: an electrical schematic or safety I/O declaration confirming the absence of active actuators and external safety-bus inputs, or integrator confirmation that the deployment includes no safety relay, E-stop bus, or PLC safety I/O connected to the instrument. A vendor assertion of N/A unsupported by any of these means should be treated as unverified and noted in the evaluation record.
requirement: |-
  The software interface MUST participate in hardware safety events without being treated as the safety function itself. The API signal is not safety-rated unless explicitly certified as part of the safety function; stop-category selection and hardware-safety-chain validation remain part of the workcell-level safety design. The prohibition targets misrepresentation of safety capability, not accurate reporting of an event. A non-rated status indication MAY name the hardware event it reports (for example, that a workcell emergency stop or protective stop has been asserted), because identifying which event occurred is part of accurate reporting. What vendor documentation, API schemas and property or method names MUST NOT do is present the software signal itself as a safety-rated function: labeling it "safety-rated," as a Safe Torque Off (STO) or Safety Integrity Level (SIL) output, or otherwise implying it discharges the safety function, unless the signal is independently certified as part of the safety function under the applicable machinery safety standard (ISO 13849, IEC 62061, or equivalent). Representing a non-rated signal as a certified safety function is a criterion Fail regardless of functional behavior, because such labeling creates a safety architecture vulnerability by which workcell integrators may inadvertently wire a non-rated software signal into a safety function.

  Two sub-tests apply. Sub-test (a) Hardware safety event reporting. When an external hardware safety event occurs (workcell-level emergency stop, safety bus signal, or other stop function as defined in IEC 60204-1), the device MUST NOT auto-resume without explicit clearance. If control power and communication remain available, the API MUST expose the latched safety-event status and the declared device state through the normal status channel. If the safety function interrupts communication or controller power, the endpoint MUST expose the latched event, last-known command state and recovery or clearance requirement on reconnect or restart before accepting normal commands; where the safety function interrupts controller power and the instrument cannot preserve the event locally, the vendor MUST document the restart-state behavior, what information is lost, what information is available from the workcell PLC or safety relay, and how the orchestrator must verify recovery before normal commands resume. This exception path can support at most Partial unless the workcell controller supplies the missing latched-state evidence.

  Sub-test (a) does not apply to instruments without external safety-bus inputs by design (typically benchtop instruments such as pH meters, balances, and basic spectrophotometers); for such instruments, sub-test (a) is graded N/A and the criterion is graded against sub-test (b) only, with vendor documentation justifying the N/A determination. Because the N/A determination is otherwise entirely vendor self-reported, the evaluator SHOULD independently verify it by requesting the instrument's electrical schematic or safety I/O declaration showing the absence of external safety-bus inputs, or by confirming with the deployment integrator that no safety relay, E-stop bus, or PLC safety I/O is wired to the instrument in the intended deployment configuration; a vendor assertion of N/A unsupported by any of these means should be treated as unverified and noted in the evaluation record. Where the deployment configuration is not yet finalized at procurement time, the evaluator SHOULD record the N/A determination as provisional ("N/A—pending deployment validation") rather than final, and require re-evaluation of sub-test (a) as part of the deployment qualification before the instrument enters unmanned workcell operation; a vendor N/A claim accepted at procurement does not exempt the instrument from sub-test (a) evaluation at deployment qualification if the final wiring includes any safety relay, E-stop bus, or PLC safety I/O connected to the instrument.

  Sub-test (b) Orchestrator-issued operational shutdown command. The API MUST accept an orchestrator-issued operational shutdown command and reach a documented operational shutdown state within a documented interval. This command is not safety-rated unless separately certified as part of the safety function.
grade_options:
- Pass
- Partial
- Fail
- N/A
grading: |-
  Criterion-level N/A applies when the instrument meets the passive-instrument definition in the applicability note above; such instruments are excluded from the applicable maximum score and their interface obligations are evaluated under C15 and C10 instead. For in-scope instruments, the sub-test grading rule applies: Pass requires every applicable sub-test to pass; Partial when at least one applicable sub-test passes; Fail when none. For instruments where sub-test (a) is graded N/A (per the requirement), the criterion is graded against sub-test (b) only. Where sub-test (a) is applicable and is evaluated via fallback evidence rather than full hardware signal assertion in the deployment configuration (per the test above), the criterion is capped at Partial regardless of the sub-test (b) outcome, and full hardware assertion of sub-test (a) is then required for a Pass-grade criterion score. Where sub-test (a) is graded N/A, the criterion is graded on sub-test (b) alone and this hardware-assertion cap does not apply. The evaluation order is: criterion-level N/A first, then sub-test (a) applicability, then sub-test grading and evidence caps.
test: |-
  For (a), assert the configured hardware safety signal during a long-running command and verify the instrument reaches its declared safe state. Where asserting the hardware safety signal pre-purchase is not feasible (workcell-level E-stop bus unavailable, safety relay not present, or the instrument is evaluated outside its intended deployment workcell), the evaluator SHOULD use one of the following fallback paths and document which was used: a test fixture simulating the safety-bus input signal per the vendor's electrical schematic; simulator-based evidence from the vendor demonstrating the latched-event and clearance-requirement behavior; factory-acceptance records covering the safety-event path; or reference-customer testimony from a documented production deployment. Fallback paths other than full hardware signal assertion correspond to at most Partial on sub-test (a), because the software behavior cannot be confirmed without asserting the actual signal in the deployment configuration. For (b), issue the orchestrator-issued operational shutdown command during a long-running command and verify that the instrument reaches its declared operational shutdown state. In both cases, verify that issuing a normal command after the safety event is rejected until clearance is given.
rationale: |-
  When a workcell-level stop or safety event occurs, every affected instrument must enter its designed response state and, where communication remains available or after controller restart, expose the latched event and recovery requirement before normal commands resume. The interface signal is a non-safety-rated operational fail-safe, not a substitute for the workcell's safety-rated infrastructure; an orchestrator-issued operational shutdown command is a distinct mechanism for graceful coordinated shutdown. Control-loss observability and safe-state support (C15) addresses control-client failure; this criterion addresses workcell-wide coordinated shutdown; C20 addresses automation-readiness states that inform automation coordination but that the workcell's independently enforced safety function does not rely on. The three criteria sit in a layered relationship: C15 backstops a single control session, safety-event participation backstops a coordinated workcell shutdown and access readiness provides the device-local inputs the workcell's automation layer composes into trajectory decisions, kept separate from the independently enforced personnel-safety functions.
