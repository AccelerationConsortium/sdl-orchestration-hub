id: C16
name: Error recovery taxonomy
tier: Important
weight: 2
effort: S
summary:
applicability:
requirement: |-
  On top of the basic error reporting required by C3, the interface SHOULD report, for each error: a transient-versus-permanent classification (retry advisable versus abort required); an execution-effect status, indicating what the device can determine about the physical effect of the failed operation (not started or no physical effect, completed, partially executed, completed-but-not-acknowledged, or effect unknown), and where the extent of execution cannot be sensed, the interface MUST report the limit of vendor knowledge rather than fabricating precision; the post-error device state; and a recovery class (programmatic-retry, programmatic-recovery, or human-intervention-required).
grade_options:
- Pass
- Partial
- Fail
grading: |-
  Pass requires all four taxonomy fields (transient/permanent classification, execution-effect status, post-error device state, recovery class) on every induced error class, including at least one representative from each additional top-level category listed in the vendor's published error taxonomy beyond the three minimum categories specified in the test; taxonomy present on the minimum three induced classes but absent or unverifiable on other documented categories is Partial. Partial covers a subset of the taxonomy fields, or full taxonomy on some error classes but not all. Fail covers typed errors without any recovery taxonomy beyond the basic identifier and message.
test: |-
  Before inducing failures, the evaluator SHOULD review the vendor's complete published error class list and identify at least one failure from each top-level error category listed therein; where a vendor's error taxonomy is unpublished or unavailable upon request, the evaluator should note this and treat the absence as a grading consideration. From the identified failures, induce at least three classes covering: a transient recoverable condition (e.g., temporary sensor or barcode-read failure); a hard hardware or firmware fault (e.g., motor fault, overpressure abort, detector fault, or temperature-control failure); and a mid-operation physical-process fault (e.g., sample-detection failure mid-scan, blocked movement, aspirate or dispense fault, or method abort). The exact induced failures MUST be safe to trigger in a pre-purchase or factory-acceptance setting; for instrument classes where inducing certain fault categories safely pre-purchase is not feasible, the evaluator SHOULD document which categories were untestable and the reason, SHOULD require simulator-based evidence or factory-acceptance records demonstrating taxonomy coverage for those categories, and SHOULD note untested categories as an explicit grading caveat. If the vendor's error taxonomy contains additional top-level categories not covered by the induced failures, select one representative failure from each additional category and verify taxonomy coverage there too.
rationale: |-
  A typed error without recovery information leaves every orchestrator to invent its own per-instrument error-class table, which is a substantial fraction of the actual integration work. The taxonomy converts "the call failed" into a programmatic decision. SiLA 2's defined-error mechanism and LADS's alarm model do not currently standardize this, which is why it is a forward-looking ask rather than a procurement floor.
