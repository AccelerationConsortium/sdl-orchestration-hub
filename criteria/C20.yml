id: C20
name: Access and motion-readiness coordination
tier: Cell-integration
weight: 2
effort: S
summary: |-
  Accurate, mutually consistent applicable access, motion and presence states, with a local robot-access indication where applicable
applicability:
requirement: |-
  The instrument SHOULD expose machine-readable, subscribable readiness states for the device-local conditions that affect external access: door, lid, or shutter status; internal-axis position and motion state (parked versus in motion); clamp, gripper, nest, or carrier engagement; labware presence at expected positions; and a vendor-declared robot-access state indicating that all internal moving parts are parked at positions the vendor has documented as safe for an external arm to enter. Applicability is per instrument class: an instrument with motorized axes exposes axis and motion state, one with retention or gripper mechanisms exposes engagement state, one with labware sensors exposes presence, and one that sits inside a robot's work envelope exposes the robot-access state; the vendor declares which categories apply, with a rationale the buyer accepts or rejects. Where none of the state categories apply to the instrument (no door, lid, or shutter; no motorized axes; no retention or gripper mechanism; no labware sensor; and not sited within a robot's work envelope), C20 is graded N/A and excluded from the applicable maximum. What matters is that these states are accurate and mutually consistent: when the instrument reports it is clear for access, its moving parts are in fact parked. No universal update-latency target is imposed, though a vendor MAY document typical latency. The interface SHOULD nevertheless document how long a readiness observation remains valid and how a subsequent change invalidates an earlier access-ready indication, since a state that is correct when sampled can be stale by the time another component acts on it. Global access coordination remains the responsibility of the workcell controller or orchestrator. These states are software coordination primitives, not safety-rated signals: they MUST NOT be used as personnel-safety inputs, and hardware safety events are covered by C21.
grade_options:
- Pass
- Partial
- Fail
- N/A
grading: |-
  Pass requires all applicable state categories to be exposed, accurate, and mutually consistent, with the robot-access state tracking the underlying conditions; where the vendor has not declared applicability, the evaluator treats all categories as applicable and notes the missing declaration as a documentation gap. Partial covers only a subset of applicable categories exposed, or all categories exposed but the applicability declaration absent. Fail covers no machine-readable readiness state, or an inaccurate or self-contradictory one — in particular a robot-access state that reports "clear" while the underlying door, axes, or mechanisms are not in their arm-safe positions; a false "clear" is a coordination-integrity failure and is not treated as an incomplete-documentation Partial.
test: |-
  For each applicable state (door, lid, or shutter; internal-axis position and motion, including a documented blocked-movement condition; clamp, gripper, nest, or carrier engagement; and labware presence), drive or simulate the condition through its documented values and at least one transition, and confirm the API reports the matching value at each point, including intermediate states; on physical hardware, cross-check the reported value against the actual condition, observed directly or with an independent sensor. Then verify that the vendor-declared robot-access state changes consistently with those underlying states, so it reports "clear" only when the door, axes, and mechanisms are actually in their arm-safe positions.
rationale: |-
  When an arm reaches into an instrument, the workcell controller needs accurate device-local state about the instrument's configuration to plan and validate the arm's trajectory, and the instrument is the primary source of the device-local observations it can sense directly, which is why exposing them is a vendor responsibility. These observations are evidence the orchestrator reconciles with its planned labware and workflow state; they do not make the instrument authoritative for the global labware history, nor do they guarantee the reported observation is identical to physical truth. These are coordination primitives, not safety-rated signals: they support workcell-level safety validation but do not replace it, and an API state named "safe to enter" must not be wired into a safety function. Personnel safety and stop functions are handled at the workcell level and under C21. Neither SiLA 2 nor LADS standardizes this set of states.
