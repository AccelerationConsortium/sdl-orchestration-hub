name: Contribute a device evaluation
description: Submit a scorecard for an instrument you have evaluated. No Git needed; a maintainer will convert this into a devices/*.yml file.
title: "[device]: <vendor> <model>"
labels: ["submission", "device"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing an evaluation! Grade each criterion **Pass**, **Partial**, or **Fail**
        (or **N/A** where the criterion allows it). See
        [`scorecard.md`](../blob/main/scorecard.md) for the full criteria and grading rules.
        You do not need to compute any totals; a maintainer will run the tooling.

        Please base grades on public documentation or your own testing, and add evidence links
        where you can. Evaluations are contributor assessments, not endorsements.

  - type: input
    id: vendor
    attributes:
      label: Vendor
      placeholder: e.g. Agilent
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model
      placeholder: e.g. 1290 Infinity II LC
    validations:
      required: true

  - type: dropdown
    id: group
    attributes:
      label: Instrument group (optional)
      options:
        - Measurement and analysis
        - Reaction hardware
        - Sample handling and preparation
        - Process sensing and control
        - Labware-moving robots

  - type: input
    id: category
    attributes:
      label: Category (optional)
      placeholder: e.g. HPLC, plate reader, liquid handler

  - type: input
    id: tasks
    attributes:
      label: Tasks (optional)
      description: What the instrument is used for, comma-separated. Shown in the website's instrument finder.
      placeholder: e.g. absorbance, fluorescence, kinetic reads

  - type: input
    id: interface
    attributes:
      label: Interface evaluated
      placeholder: e.g. SiLA 2, OPC UA / LADS, REST, vendor SDK
    validations:
      required: true

  - type: input
    id: interfaces
    attributes:
      label: Other interfaces offered (optional)
      description: Every other control interface the vendor offers for this model, comma-separated.
      placeholder: e.g. REST + OpenAPI, vendor SDK

  - type: dropdown
    id: architecture
    attributes:
      label: C1 endpoint architecture
      options:
        - Native endpoint
        - Vendor edge-controller
        - Third-party gateway
        - Not sure

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment evaluated
      options:
        - standalone
        - cell-integrated
    validations:
      required: true

  - type: dropdown
    id: evidence_basis
    attributes:
      label: Evidence basis
      options:
        - vendor-docs
        - hands-on-test
        - integrator-report
    validations:
      required: true

  - type: textarea
    id: scores
    attributes:
      label: Grades (C1–C21)
      description: >
        Put your grade after each colon: Pass, Partial, Fail, or N/A. Add a short note in
        parentheses and an evidence URL if you have one. N/A is permitted only where the
        criterion defines it (C7, C19, C20, C21). Use N/A for the cell-integration tier
        (C19–C21) if you evaluated the instrument standalone.
      value: |
        C1  Orchestrator-reachable programmatic control:
        C2  Strong typing with units and constraints:
        C3  Structured error reporting:
        C4  Open API access:
        C5  Control-accessible result retrieval:
        C6  Runtime self-description:
        C7  Observable command and property state:
        C8  Reference client implementation:
        C9  Concurrent-access discipline:
        C10 Machine-readable device and readiness state:
        C11 Result addressability and durability:
        C12 Instrument self-state:
        C13 Versioning discipline:
        C14 Simulation or emulation mode:
        C15 Control-loss observability and safe-state support:
        C16 Error recovery taxonomy:
        C17 Conformance and certification:
        C18 Operating-system independence:
        C19 Automated load/unload:
        C20 Access and motion-readiness coordination:
        C21 Safety-event participation:
    validations:
      required: true

  - type: input
    id: evaluator
    attributes:
      label: Attribution
      description: Name, org, or handle to credit (may be a pseudonym).
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware / software version (optional)

  - type: input
    id: product_url
    attributes:
      label: Product URL (optional)
