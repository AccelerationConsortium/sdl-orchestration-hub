# Device evaluation template.
# Copy this file to  devices/<vendor>-<model>.yml  (lowercase, hyphenated) and fill it in.
# You only assign grades and notes; the tooling computes totals and floor checks for you.
# Run:  uv run python build/score_device.py --check
#
# Grade each criterion Pass / Partial / Fail (or N/A where the criterion allows it —
# see criteria/CXX.yml `grade_options`). Provide `evidence` (a URL or doc reference)
# wherever you can; it is what separates a useful evaluation from an opinion.

device:
  vendor: Example Vendor
  model: Example Model 100
  category: plate reader            # optional: instrument type
  group: measurement                # optional: measurement | reaction | sample-handling | process-control | labware-robot
  tasks: [absorbance, fluorescence] # optional: what it is used for (shown in the web tool's instrument finder)
  interface: SiLA 2                 # protocol you evaluated
  interfaces: [SiLA 2]              # optional: every control interface the vendor offers
  architecture: Native endpoint     # C1 architecture: Native endpoint | Vendor edge-controller | Third-party gateway
  firmware_version: null            # optional
  product_url: null                 # optional

evaluation:
  evaluator: your-name-or-handle
  date: 2026-01-01
  scorecard_version: 1.0.0          # which criteria set you scored against
  deployment: standalone            # standalone | cell-integrated
  evidence_basis: vendor-docs       # vendor-docs | hands-on-test | integrator-report
  # verified: false                 # set by maintainers only

scores:
  # Critical tier (C5 may be N/A)
  C1:  { grade: Fail, note: "", evidence: null }
  C2:  { grade: Fail }
  C3:  { grade: Fail }
  C4:  { grade: Fail }
  C5:  { grade: Fail }
  # Important tier
  C6:  { grade: Fail }
  C7:  { grade: Fail }
  C8:  { grade: Fail }
  C9:  { grade: Fail }
  C10: { grade: Fail }
  C11: { grade: Fail }
  C12: { grade: Fail }
  C13: { grade: Fail }
  C14: { grade: Fail }
  C15: { grade: Fail }
  C16: { grade: Fail }
  C17: { grade: Fail }
  C18: { grade: Fail }
  # Cell-integration tier — grade only if you evaluated workcell deployment,
  # otherwise use N/A (or omit if deployment: standalone).
  C19: { grade: "N/A" }
  C20: { grade: "N/A" }
  C21: { grade: "N/A" }

# vendor_response: null             # optional right-of-reply
