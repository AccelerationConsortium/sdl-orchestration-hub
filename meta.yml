title: Device Integration Scorecard
grade_values:
  Pass: 1.0
  Partial: 0.5
  Fail: 0.0
  N/A:
tiers:
- Critical
- Important
- Cell-integration
totals:
  standalone:
    criteria: C1-C18
    max: 46
  cell_integrated:
    criteria: C1-C21
    max: 52
floors:
- name: Critical floor
  text: |-
    At most one Critical criterion at Partial, with all others Pass; any Fail on a Critical criterion disqualifies the vendor regardless of the weighted total. A Critical Partial may be accepted with a written remediation commitment and a target date (twelve-month ceiling recommended), particularly when the gap is a contract or documentation deliverable rather than an engineering rebuild; procurement contracts SHOULD include the remediation deadline and clawback or termination-for-convenience provisions tied to the commitment.
- name: Important floor
  text: |-
    Failed Important criteria may not exceed four weighted points in total. For instruments operating unattended with active physical hazards, control-session loss must at least be observable through the API (C15 not Fail) unless it is handled by a documented external mechanism, orchestrator-side or workcell-level. C7 has a conditional floor: for instruments whose operations involve hazardous actuation or block shared resources, C7 MUST score at least Partial unless a documented external mitigation applies (see C7). An Important Fail may be accepted only with a documented institutional gap-acceptance decision identifying the gap, its procurement risk and any compensating control; accepted failures still count toward the four-point ceiling.
- name: Cell-integration floor
  text: |-
    For cell-integrated procurement, C19 (automated load/unload) MUST score at least Partial when a machine loads labware into the instrument or removes it; a Fail disqualifies the vendor from cell-integrated deployment regardless of the weighted total. C19 is N/A for instruments that do not receive machine-loaded labware. C20 and C21 have no universal floor, but for instruments inside the robot work envelope, with hazardous motion, or with thermal, pressure, optical or chemical hazards, buyers SHOULD make C20, C21 or both local floors at least at Partial and accept Fail only with a documented external mitigation in place.
